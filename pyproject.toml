[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pysmwcentral"
dynamic = ["version"]
description = "Python client for the smwcentral.net public JSON API"
license = { text = "Apache-2.0" }
authors = [{ name = "JarbasAi", email = "jarbasai@mailfence.com" }]
requires-python = ">=3.8"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests",
    "unblock_requests",
]

[project.optional-dependencies]
anon = ["anon_requests"]
stealth = ["curl-cffi"]
test = ["pytest", "pytest-recording", "vcrpy"]

[project.urls]
Homepage = "https://github.com/TigreGotico/pysmwcentral"
Repository = "https://github.com/TigreGotico/pysmwcentral"
Issues = "https://github.com/TigreGotico/pysmwcentral/issues"

[tool.pytest.ini_options]
markers = [
    "live: hits the live smwcentral.net API (deselect with -m 'not live')",
]

[tool.setuptools.dynamic]
version = { attr = "pysmwcentral.version.__version__" }

[tool.setuptools.packages.find]
include = ["pysmwcentral*"]
