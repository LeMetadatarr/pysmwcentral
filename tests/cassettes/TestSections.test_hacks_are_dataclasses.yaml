        you can watch the release trailer for it here:<br>\r\nhttps:\/\/youtu.be\/fqbJBcCcdOo<br>\r\n<br>\r\nThe
        complete soundtrack is now available here (contains spoilers!):<br>\r\nhttps:\/\/youtu.be\/A2l3bq0RbyQ<br>\r\n<br>\r\nUpdated
        to version 1.1.1 on 18th of May 2026. Unless a major issue is discovered,
        this will be the final update. The main purpose of this update is to improve
        the overall player experience, especially for first playthroughs, by (hopefully)
        making some obstacles a bit more readable, fixing some jank and crashes, adding
