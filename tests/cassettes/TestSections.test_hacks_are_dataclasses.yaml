        exit(s)","hof":"Yes","demo":"No","collab":"No","sa1":"No","warnings":"","description":"\"Yoshi
        is a tool to be used and then discarded.\"<br>\r\n<br>\r\nThese words have
        long been held as absolute truth in Kaizo level design. Every appearance of
        Yoshi is followed by a swift press of the A button. But Yoshi has had enough,
        in a surprising twist he captures Mario and locks him away. It''s not clear
        what Yoshi is planning, but Mario doesn''t intend to find out. He escapes
        Yoshi''s dungeon and sets out on a quest to find 3 elemental powers (switch
        palaces) to stop Yoshi before it''s too late.<br>\r\n<br>\r\nYoshi''s Revenge
        is my second hack, releasing over seven years after my first, the somewhat
        infamous Salty Sagan World. My main goal was to take the same largely traditional
        Kaizo gameplay from my first hack and polish it up a lot, keeping the fun
        and reducing the frustration, as well as adding a little bit of chocolate
        sprinkles. Additionally, this game is designed with replayability in mind,
        has intriguing and rewarding secrets (which aren''t portraits or an overarching
        puzzle), and a rich post-game that offers a variety of optional challenges
        such as: more difficult levels, endurance tests, playing under restrictions
        and speedrunning, for players who want to test their skills further.<br>\r\n<br>\r\nThis
        is also a game with a lot of freedom. There are over 200 paths through the
        game, so you have the opportunity to prioritize the levels that look most
        appealing. Out of the 46 total exits, you should only see 26 or 27 on a standard
        playthrough (assuming you don''t go out of your way to play extra levels).
        To help you make informed decisions, each level has a length and difficulty
        rating. Secret exits are intentionally made very difficult to find without
        the hints provided in the game. As you learn how the world is connected, you
        will have more agency to play through the game however you want on repeat
        playthroughs. My intention was to make learning the world layout something
        that could be mastered in itself, similar to how some 2D Metroid games work.
        There is even a Metroid Zero Mission style gallery that rewards you for finding
        specific paths through the game and playing well. However, there is only one
        ending! If you''re not interested in secrets or playing more levels than necessary,
        then rest assured, that is also a perfectly valid way to enjoy this game.<br>\r\n<br>\r\nAs
        for the ever-divisive topic of difficulty... to be blunt, I think some people
        read way too much into difficulty ratings on SMWCental as if it''s some kind
        of objective science, when it could not be further from. Especially for a
        game as big and open as this one, it''s impossible to accurately capture the
        difficulty with a single rating. Some things in this game could be beaten
        by almost anyone. Some hidden post-game challenges in this game are approaching
        the limit of what is humanly possible. This is entirely by design, as I want
        players with a variety of skill levels to be able to set their own goals within
        the hack, and maybe even encourage them to improve by offering, but not forcing,
        a challenge that is just outside their comfort zone. The chosen difficulty
        of ''Master'' is intended to reflect the skill required to somewhat comfortably
        obtain the save file star shown in screenshot 2. While just beating the game
        is certainly easier, especially since you have a lot of freedom in choosing
        what levels you play, I suspect you may still stumble into some uncomfortable
        difficulty spikes if you don''t have a lot of experience with SMW under your
        belt.<br>\r\n<br>\r\nWith that said, I''d like to emphasize that I was not
        really aiming for a specific difficulty while making this game. First and
        foremost, I wanted to explore a wide range of ideas, both mechanically and
        aesthetically, and make levels that felt satisfying to blast through, especially
        once you know them. Generally, I wanted them to put up enough of a fight to
        unquestionably feel like Kaizo while also having enough leeway to allow for
        player expression and leave room for improvement on repeat playthroughs. If
        I succeeded, there should hopefully be a noticeable difference between beating
        a level and mastering it.<br>\r\n<br>\r\nIt''s very hard to believe it has
        been over six years since I started working on this game. What started as
        a simple follow-up to Salty Sagan World, became a massive passion project
        that I poured my heart and soul into for probably many thousands of hours.
        Being a Kaizo game, and one that at times features some daring decisions,
        it will undoubtedly generate some frustration - and releasing it has me very
        nervous. Actually, I believe panicking is a more apt word. But at the very
        least, I am incredibly proud of what I have made, and I say this from the
        bottom of my heart:<br>\r\n<br>\r\nIf you are a player, I hope you will enjoy
        playing this game.<br>\r\nIf you are a viewer, I hope this game will provide
        many opportunities for you to say KEKW.<br>\r\nAnd, if you are a creator,
        I hope this game will inspire you to make something amazing.<br>\r\n<br>\r\nPlease
        see the included text files for information related to save data and things
