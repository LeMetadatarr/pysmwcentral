        ReadMe for full version updates","difficulty":"Intermediate","type":"Kaizo","length":"28
        exit(s)","hof":"No","demo":"No","collab":"No","sa1":"No","warnings":"","description":"This
        romhack was created to test the player\u2019s skill, patience and reflexes.
        It presents challenges difficult enough that a standard player may struggle,
        but indicators throughout are in place to help guide you to the goal. This
        hack makes use of some more complicated tech that may be unfamiliar to the
        casual player- blue coins are in place to indicate spin jumps and green coins
        indicate item throws (usually shells). It is considerably more ambitious than
        the original in design, graphics, effects, etc. Color palettes and graphic
        choices were carefully picked to match the setting and create a specific tone
        for each level. Every level\u2019s soundtrack was also selected in an effort
        to create a satisfying gameplay loop as the player grinds each of the 28 courses.
        The map is comprised of several different zones strung together to feel like
        a complete world. Levels do not have a difficulty curve as there are plenty
        of \u2018palette cleansers\u2019 throughout. This design choice was decided
        to give the player a chance to breathe and continue progressing without wanting
