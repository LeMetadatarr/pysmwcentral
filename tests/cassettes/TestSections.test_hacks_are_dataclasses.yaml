        each zone on the outskirts of the castle to activate blocks necessary to reveal
        the path to the final area. Each area is filled with it''s own theme and level
        gimmicks to match. The graphics and audio were carefully selected in an effort
        to keep game play both satisfying and fresh. Some levels are less difficult
        than others as seen in previous installments and are meant to give the player
