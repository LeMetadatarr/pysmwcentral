        there''s a small amount of DLC (brand new content!) that both new and old
        players can enjoy. Please consult the changelog for all the details. Existing
        save files are compatible with 1.1.1."},"raw_fields":{"version":"","changelog":"","difficulty":"diff_6","type":["kaizo"],"length":46,"hof":true,"demo":false,"collab":false,"sa1":false,"warnings":[],"description":"\"Yoshi
